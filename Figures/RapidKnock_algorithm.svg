<svg viewBox="0 0 740 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L7,4 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="740" height="900" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="370" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" letter-spacing="0.8">RapidKnock Algorithm</text>

  <!-- START -->
  <ellipse cx="370" cy="76" rx="80" ry="24" fill="#111"/>
  <text x="370" y="81" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" letter-spacing="1.5">START</text>

  <line x1="370" y1="100" x2="370" y2="124" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- STEP 1 -->
  <rect x="185" y="126" width="370" height="48" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Load GEM and Set Conditions</text>
  <text x="370" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Apply predetermined knockouts, if any; compute WT biomass</text>

  <line x1="370" y1="174" x2="370" y2="198" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- STEP 2: FVA P1 -->
  <rect x="185" y="200" width="370" height="48" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">FVA — P1</text>
  <text x="370" y="237" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Maximise biomass; compute per-reaction flux ranges</text>

  <line x1="370" y1="248" x2="370" y2="272" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- STEP 3: FVA P2 -->
  <rect x="185" y="274" width="370" height="56" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">FVA — P2</text>
  <text x="370" y="311" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Maximise target metabolite production</text>
  <text x="370" y="324" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Subject to biomass ≥ MIN_BIOMASS_FRAC × WT</text>

  <line x1="370" y1="330" x2="370" y2="354" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- STEP 4: Candidates -->
  <rect x="155" y="356" width="430" height="62" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Identify Candidate Reactions</text>
  <text x="370" y="393" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">GPR-associated, non-transport; |P1_min| &gt; FLUX_THRESHOLD</text>
  <text x="370" y="410" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">P2_max &lt; P1_min  OR  |P2_min| &lt; |P1_min|</text>

  <line x1="370" y1="418" x2="370" y2="442" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- STEP 5: Lethality -->
  <rect x="185" y="444" width="370" height="48" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="464" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Lethality Pre-screen</text>
  <text x="370" y="481" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Exclude reactions whose individual removal is lethal</text>

  <line x1="370" y1="492" x2="370" y2="516" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- STEP 6: Test combinations -->
  <rect x="155" y="518" width="430" height="56" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="538" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Test All Combinations of Size k</text>
  <text x="370" y="555" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Simulate KO by FBA; record biomass growth rate and target metabolite flux</text>
  <text x="370" y="568" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Retain combinations meeting biomass and yield thresholds</text>

  <line x1="370" y1="574" x2="370" y2="598" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- DIAMOND -->
  <polygon points="370,600 510,656 370,712 230,656" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="650" text-anchor="middle" font-size="11.5" fill="#111" font-weight="bold">Additional</text>
  <text x="370" y="667" text-anchor="middle" font-size="11.5" fill="#111" font-weight="bold">rounds?</text>

  <!-- YES loop left -->
  <line x1="230" y1="656" x2="104" y2="656" stroke="#111" stroke-width="1.8"/>
  <line x1="104" y1="656" x2="104" y2="302" stroke="#111" stroke-width="1.8"/>
  <line x1="104" y1="302" x2="183" y2="302" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="166" y="648" text-anchor="middle" font-size="10.5" fill="#111" font-weight="bold">Yes</text>

  <!-- Lock best combo annotation -->
  <rect x="18" y="438" width="74" height="38" rx="3" fill="#ffffff" stroke="#111" stroke-width="0.9"/>
  <text x="55" y="454" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111">Lock best</text>
  <text x="55" y="468" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111">combo</text>
  <line x1="92" y1="457" x2="104" y2="457" stroke="#111" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- NO arrow down -->
  <line x1="370" y1="712" x2="370" y2="736" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="394" y="728" text-anchor="start" font-size="10.5" fill="#111" font-weight="bold">No</text>

  <!-- STEP 7: Rank -->
  <rect x="185" y="738" width="370" height="56" rx="3" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="370" y="758" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Rank and Report Solutions</text>
  <text x="370" y="775" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">All retained combinations ranked by target metabolite yield</text>
  <text x="370" y="788" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111">Exported with growth rate, target metabolite flux, and mol/mol yield</text>

  <line x1="370" y1="794" x2="370" y2="818" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- END -->
  <ellipse cx="370" cy="842" rx="80" ry="24" fill="#111"/>
  <text x="370" y="847" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" letter-spacing="1.5">END</text>

</svg>
